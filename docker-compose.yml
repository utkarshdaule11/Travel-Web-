# ==============================================================================
# Young Tours & Travels - Local Development Compose Topology
# ==============================================================================
services:
  # 1. PostgreSQL 15 Database Service
  postgres:
    image: postgres:15-alpine
    container_name: travel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
      POSTGRES_DB: travel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 In-Memory Service (BullMQ & Cache)
  redis:
    image: redis:7-alpine
    container_name: travel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO S3-Compatible Object Storage Service
  minio:
    image: minio/minio:latest
    container_name: travel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Backend Fastify API Application Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: travel_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://travel_user:travel_password@postgres:5432/travel_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: local
      COOKIE_SECRET: super_secure_dev_cookie_signing_secret_minimum_32_characters_12345
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Asynchronous Background Worker Process
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: travel_worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://travel_user:travel_password@postgres:5432/travel_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
